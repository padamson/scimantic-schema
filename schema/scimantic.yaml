id: http://scimantic.io/schema
name: scimantic
description: |-
  A LinkML schema for representing the scientific method as provenance
  chains. v0.3.0 is a ground-up rebuild — see book/ for the chapter-
  by-chapter journey, following Ontology Development 101 (Noy &
  McGuinness, 2001) adapted to LinkML.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.3.0-dev

prefixes:
  linkml: https://w3id.org/linkml/
  scimantic: http://scimantic.io/

default_prefix: scimantic
default_range: string

imports:
  - linkml:types
