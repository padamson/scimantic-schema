id: https://w3id.org/scimantic
name: scimantic
description: |-
  A LinkML schema for representing the scientific method as provenance
  chains, grounded in BFO 2020 (ISO/IEC 21838-2:2020) and the Common
  Core Ontologies (CCO). v0.3.0 is a ground-up rebuild — see the
  [book](https://padamson.github.io/scimantic-schema/) for the
  chapter-by-chapter journey, following Ontology Development 101
  (Noy & McGuinness, 2001) adapted to LinkML.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.3.0-dev

prefixes:
  # CALLOUT: reuse-manifest Most prefixes here name an ontology this schema reuses; the block is the machine-readable manifest of the N&M Step 2 decision. The two exceptions are scimantic: (this schema's own namespace, where invented terms live) and linkml: (the LinkML metamodel).
  # The LinkML metamodel and scimantic's own namespace
  linkml: https://w3id.org/linkml/
  scimantic: https://w3id.org/scimantic/

  # Foundational grounding: BFO and CCO
  # CALLOUT: foundation Every scimantic class will ultimately subclass a category drawn from these two foundations: BFO (top-level) and CCO (mid-level).
  obo: http://purl.obolibrary.org/obo/
  # CALLOUT: prov-transitive No prov: prefix is declared. PROV-O interoperability is inherited transitively through this CCO grounding, via the published PROV-to-BFO/CCO alignment (Beverley et al., Nature Scientific Data 2025) — a consumer applies that alignment rather than scimantic restating it.
  cco: https://www.commoncoreontologies.org/

  # Reused domain vocabularies: metadata, annotation, datasets,
  # nanopublication, uncertainty, claim relations
  dcterms: http://purl.org/dc/terms/
  oa: http://www.w3.org/ns/oa#
  dcat: http://www.w3.org/ns/dcat#
  np: http://www.nanopub.org/nschema#
  # CALLOUT: urref-namespace Committed in principle, but URREF has no stable canonical IRI; this ETURWG-hosted URL is the most authoritative available. Resolving a permanent namespace is deferred to the chapter where uncertainty classes land.
  urref: http://eturwg.c4i.gmu.edu/files/ontologies/URREF.owl#
  # CALLOUT: cito CiTO (SPAR) supplies the claim relations: supports/contradicts/refines map to cito:supports / cito:disputes (or cito:refutes) / cito:extends. CiTO's object properties carry no domain or range, so they apply claim-to-claim despite CiTO's citation-to-citation narrative.
  cito: http://purl.org/spar/cito/

default_prefix: scimantic
default_range: string

# CALLOUT: imports-by-uri Only linkml:types is imported. External OWL ontologies (BFO, CCO, ...) are reused by URI via class_uri/slot_uri plus the prefixes above — never via imports:, which is reserved for other LinkML schemas.
imports:
  - linkml:types
