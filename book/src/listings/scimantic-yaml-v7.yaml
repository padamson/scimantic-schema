id: https://w3id.org/scimantic
name: scimantic
description: |-
  A LinkML schema for representing the scientific method as provenance
  chains, grounded in BFO 2020 (ISO/IEC 21838-2:2020) and the Common
  Core Ontologies (CCO). v0.3.0 is a ground-up rebuild — see the
  [book](https://padamson.github.io/scimantic-schema/) for the
  chapter-by-chapter journey, following Ontology Development 101
  (Noy & McGuinness, 2001) adapted to LinkML.
license: https://creativecommons.org/licenses/by/4.0/
version: 0.3.0-dev

prefixes:
  # CALLOUT: reuse-manifest Most prefixes here name an ontology this schema reuses; the block is the machine-readable manifest of the N&M Step 2 decision. The two exceptions are scimantic: (this schema's own namespace, where invented terms live) and linkml: (the LinkML metamodel).
  # The LinkML metamodel and scimantic's own namespace
  linkml: https://w3id.org/linkml/
  scimantic: https://w3id.org/scimantic/

  # Foundational grounding: BFO and CCO
  # CALLOUT: foundation Every scimantic class will ultimately subclass a category drawn from these two foundations: BFO (top-level) and CCO (mid-level).
  obo: http://purl.obolibrary.org/obo/
  # CALLOUT: prov-transitive No prov: prefix is declared. PROV-O interoperability is inherited transitively through this CCO grounding, via the published PROV-to-BFO/CCO alignment (Beverley et al., Nature Scientific Data 2025) — a consumer applies that alignment rather than scimantic restating it.
  cco: https://www.commoncoreontologies.org/

  # Reused domain vocabularies: metadata, annotation, datasets,
  # nanopublication, uncertainty, claim relations
  dcterms: http://purl.org/dc/terms/
  oa: http://www.w3.org/ns/oa#
  dcat: http://www.w3.org/ns/dcat#
  np: http://www.nanopub.org/nschema#
  # CALLOUT: urref-namespace Committed in principle, but URREF has no stable canonical IRI; this ETURWG-hosted URL is the most authoritative available. Resolving a permanent namespace is deferred to the chapter where uncertainty classes land.
  urref: http://eturwg.c4i.gmu.edu/files/ontologies/URREF.owl#
  # CALLOUT: cito CiTO (SPAR) supplies the claim relations: supports/contradicts/refines map to cito:supports / cito:disputes (or cito:refutes) / cito:extends. CiTO's object properties carry no domain or range, so they apply claim-to-claim despite CiTO's citation-to-citation narrative.
  cito: http://purl.org/spar/cito/

default_prefix: scimantic
default_range: string

# CALLOUT: imports-by-uri Only linkml:types is imported. External OWL ontologies (BFO, CCO, ...) are reused by URI via class_uri/slot_uri plus the prefixes above — never via imports:, which is reserved for other LinkML schemas.
imports:
  - linkml:types

classes:

  # CALLOUT: grounding Each foundational kind is an abstract anchor grounded in its BFO/CCO category by subclass_of (rdfs:subClassOf to the external term, the Biolink-established pattern), not a wrapper class as in v0.2. Domain classes is_a these anchors and inherit the grounding.
  Claim:
    abstract: true
    # CALLOUT: ice cco:ont00000853 is CCO Descriptive Information Content Entity — an ICE of propositions that describe some entity. Claims specialize it; methods specialize its disjoint sibling, Prescriptive ICE (cco:ont00000965).
    subclass_of: cco:ont00000853
    slots:
      - supports
      - contradicts
      - refines
    description: >-
      An information content entity that asserts something about the
      world. The shared parent of the claim relations, so supports,
      contradicts, and refines apply whether or not a hypothesis is
      present.

  Hypothesis:
    is_a: Claim
    description: >-
      A conjectured claim a study may be designed to test. Optional
      in the chain, since exploratory inquiry has none.

  # CALLOUT: claim-spine Evidence and Premise are one claim at two standings. A piece of Evidence becomes a Premise when an EvidenceAssessment confers an AcceptedState on it: the same node, with no second class and no derivedFrom edge.
  Evidence:
    is_a: Claim
    description: >-
      A claim offered as bearing on another. It becomes a Premise
      once an EvidenceAssessment accepts it, the same node now
      carrying an AcceptedState.

  Conclusion:
    is_a: Claim
    description: >-
      A claim drawn from premises and evidence, with or without an
      intervening hypothesis.

  Act:
    abstract: true
    # CALLOUT: planned-act cco:ont00000228 is CCO Planned Act — a process that realizes a plan. Act specializes it.
    subclass_of: cco:ont00000228
    slots:
      - agent
      - performedAt
      - hasInput
      - hasOutput
    description: >-
      An agentive planned process that produces or transforms
      artifacts. The shared supertype CQ 10, 14, and 15 quantify
      over.

  EvidenceAssessment:
    is_a: Act
    description: >-
      Weighs a piece of evidence for credibility and, on
      acceptance, confers an AcceptedState on it.

  QuestionFormation:
    is_a: Act
    description: >-
      The act of forming a question; its output an open Question.

  LiteratureSearch:
    is_a: Act
    description: >-
      A search over source documents that addresses motivating
      questions and may surface new ones.

  EvidenceExtraction:
    is_a: Act
    description: >-
      The act of extracting a piece of Evidence from an annotation
      on a source document.

  HypothesisFormation:
    is_a: Act
    description: The act of synthesizing a Hypothesis from its premises.

  DesignOfExperiment:
    is_a: Act
    slots:
      - tests
    description: >-
      The act of designing an experimental method to test a
      hypothesis; the bearer of the prospective tests intent.

  Experimentation:
    is_a: Act
    slots:
      - executes
    description: >-
      The act that executes an experimental method, realizing its
      plan.

  Analysis:
    is_a: Act
    slots:
      - executes
    description: >-
      The act that applies a method to data to produce a result.

  ResultAssessment:
    is_a: Act
    description: >-
      The act of assessing a result and drawing a conclusion from
      it.

  # CALLOUT: prescriptive cco:ont00000965 is CCO Prescriptive Information Content Entity — an ICE that prescribes (the directive branch, disjoint from Descriptive ICE). Method is scimantic's plan specification under it; an Act realizes it.
  Method:
    abstract: true
    subclass_of: cco:ont00000965
    description: >-
      A prescriptive information content entity that prescribes how
      to carry out an act, realized by the acts that execute it.
      Exists independently of any single run.

  ExperimentalMethod:
    is_a: Method
    description: >-
      A method prescribing how to carry out an experiment; realized
      by an Experimentation act and designed by a DesignOfExperiment.

  AnalyticalMethod:
    is_a: Method
    description: >-
      A method prescribing how to analyze data to produce a result;
      realized by an Analysis act.

  State:
    abstract: true
    # CALLOUT: stasis cco:ont00000819 is CCO Stasis — a condition that persists unchanged over a temporal interval. State specializes it.
    subclass_of: cco:ont00000819
    slots:
      - qualifies
      - establishedBy
      - occursOver
    description: >-
      A condition that obtains over a temporal interval,
      established by an act. scimantic models standing as state
      rather than as an enum value.

  OpenState:
    is_a: State
    description: >-
      The standing of a claim awaiting adjudication: a question not
      yet answered, or a conclusion submitted but not yet accepted.

  AcceptedState:
    is_a: State
    description: >-
      The standing of a claim or method endorsed by an establishing
      act — evidence accepted as a premise, a conclusion accepted in
      review, or a method validated by a successful execution —
      holding until any retraction.

  RetractedState:
    is_a: State
    description: >-
      The standing of a claim or method whose acceptance has been
      withdrawn.

  # CALLOUT: agent cco:ont00001017 is CCO Agent — a material entity that bears intentions and performs acts. scimantic's Agent grounds in it by subclass_of, owning the class so provenance slots can hang on it.
  Agent:
    subclass_of: cco:ont00001017
    description: >-
      A material entity that performs acts and bears responsibility
      for them — a researcher, group, or institution.

  # CALLOUT: temporal-interval obo:BFO_0000038 is BFO one-dimensional temporal region — a temporal region with extent. scimantic's TemporalInterval grounds in it by subclass_of; an act occupies one rather than a single instant.
  TemporalInterval:
    subclass_of: obo:BFO_0000038
    description: >-
      The stretch of time an act occupies, with a beginning and an
      end rather than a single instant.

  # CALLOUT: ice-general cco:ont00000958 is CCO Information Content Entity — the general ICE, parent of the Descriptive and Prescriptive branches. A Question is an ICE but neither: it asks rather than asserts or prescribes.
  Question:
    subclass_of: cco:ont00000958
    description: >-
      An information content entity expressing what an inquiry seeks
      to answer; the output of a QuestionFormation and the start of
      a provenance chain.

  # CALLOUT: descriptive-ice cco:ont00000853 is CCO Descriptive Information Content Entity — content that describes. A Result describes a finding.
  Result:
    subclass_of: cco:ont00000853
    description: >-
      A finding produced by an Analysis; the input a ResultAssessment
      weighs in drawing a conclusion.

  # CALLOUT: document cco:ont00001298 is CCO Document — an Information Bearing Artifact that bears information content (a paper or file): the *bearer*, distinct from the ICE content it carries.
  SourceDocument:
    subclass_of: cco:ont00001298
    description: >-
      A document a LiteratureSearch surfaces and an Annotation marks
      up; the bearer a piece of Evidence is extracted from.

  # CALLOUT: evrel-ice cco:ont00000853 is CCO Descriptive Information Content Entity; an EvidentialRelation is a reified, described claim-to-claim relation under it.
  EvidentialRelation:
    subclass_of: cco:ont00000853
    slots:
      - subject
      - object
      - polarity
      - strength
      - assertedBy
    description: >-
      A reified claim-to-claim relation between a subject and an
      object claim: a Descriptive ICE carrying a cito-typed
      polarity, a strength, and the asserting act, through which
      the agent and time are reached.

  # CALLOUT: quality obo:BFO_0000019 is BFO Quality — a specifically dependent continuant that inheres in a bearer. Uncertainty and credibility are graded qualities.
  Uncertainty:
    subclass_of: obo:BFO_0000019
    description: >-
      A quality of a result quantifying how much it could vary;
      borne by the result, quantified by an UncertaintyModel.

  Credibility:
    subclass_of: obo:BFO_0000019
    description: >-
      A graded quality of a piece of evidence expressing how far it
      can be relied on; conferred by an EvidenceAssessment.

  # CALLOUT: model-ice cco:ont00000853 is CCO Descriptive Information Content Entity; an UncertaintyModel describes a result's uncertainty quality.
  UncertaintyModel:
    subclass_of: cco:ont00000853
    slots:
      - quantifies
      - family
      - parameters
      - confidenceLevel
      - nature
    description: >-
      A Descriptive ICE that quantifies a result's uncertainty
      quality: a family, its parameters, a confidence level, and a
      nature (aleatory or epistemic).

  StatisticalMethod:
    is_a: AnalyticalMethod
    description: >-
      An analytical method prescribing how to derive a result's
      uncertainty and credibility from data.

  # CALLOUT: line-ice cco:ont00000853 is CCO Descriptive Information Content Entity; an EvidenceLine asserts that several pieces of evidence jointly bear on a claim under one strength.
  EvidenceLine:
    subclass_of: cco:ont00000853
    slots:
      - members
      - strength
      - bearsOn
    description: >-
      A Descriptive ICE grouping several pieces of evidence under
      one strength and asserting their joint bearing on a claim.

  # CALLOUT: study-act cco:ont00000228 is CCO Planned Act; a Study is a composite planned act over one question-to-conclusion cycle.
  Study:
    subclass_of: cco:ont00000228
    slots:
      - hasPart
    description: >-
      A planned process whose parts are the formations, searches,
      experiments, and analyses of one question-to-conclusion cycle.

  # CALLOUT: reuse-wholesale Dataset and Annotation are reused wholesale from DCAT and the W3C Web Annotation model: class_uri co-identifies scimantic's class with the external one (it *is* that class). This is the counterpart to subclass_of grounding, which is for scimantic's own specializations of a BFO/CCO category.
  Dataset:
    class_uri: dcat:Dataset
    description: >-
      A dataset reused from W3C DCAT: the input to an analysis or
      experiment, or the output a result is drawn from.

  Annotation:
    class_uri: oa:Annotation
    description: >-
      An annotation on a source document, reused from the W3C Web
      Annotation model; an EvidenceExtraction draws a piece of
      Evidence from one.

slots:

  # CALLOUT: cito-supports In the full schema, supports/contradicts/refines reify into an EvidentialRelation carrying agent, time, and strength. The bare slot here grounds in CiTO via exact_mappings.
  supports:
    range: Claim
    multivalued: true
    exact_mappings:
      - cito:supports
    description: Asserts that one claim bears positively on another.

  contradicts:
    range: Claim
    multivalued: true
    exact_mappings:
      - cito:disputes
    description: Asserts that one claim bears negatively on another.

  refines:
    range: Claim
    multivalued: true
    exact_mappings:
      - cito:extends
    description: Asserts that one claim refines or extends another.

  # CALLOUT: has-agent cco:ont00001833 is CCO "has agent" — the relation tying an act to its performing agent.
  agent:
    range: Agent
    multivalued: true
    exact_mappings:
      - cco:ont00001833
    description: The agent or agents who performed an act.

  # CALLOUT: occupies obo:BFO_0000199 is BFO "occupies temporal region" — an occurrent to the interval it runs over.
  performedAt:
    range: TemporalInterval
    exact_mappings:
      - obo:BFO_0000199
    description: The temporal interval an act occupies.

  tests:
    range: Hypothesis
    description: >-
      The hypothesis a DesignOfExperiment is designed to test:
      prospective intent, carried by the design act rather than the
      method it produces.

  # CALLOUT: prescribed-by cco:ont00001920 is CCO "prescribed by" — an act to the Prescriptive ICE (the Method) that guides it.
  executes:
    range: Method
    exact_mappings:
      - cco:ont00001920
    description: >-
      The method an act carries out; the act is prescribed by the
      method's plan specification.

  # CALLOUT: has-input cco:ont00001921 is CCO "has input" — the generic process-participation relation for an act's inputs.
  hasInput:
    multivalued: true
    any_of:
      - range: Claim
      - range: Question
      - range: Result
      - range: Method
      - range: Dataset
      - range: Annotation
      - range: SourceDocument
    exact_mappings:
      - cco:ont00001921
    description: >-
      An artifact an act consumes; ranged broadly over the schema's
      artifacts here, narrowed per-act in Chapter 7.

  # CALLOUT: has-output cco:ont00001986 is CCO "has output" — the generic relation for an act's outputs.
  hasOutput:
    multivalued: true
    any_of:
      - range: Claim
      - range: Question
      - range: Result
      - range: Method
      - range: Dataset
      - range: Annotation
      - range: SourceDocument
    exact_mappings:
      - cco:ont00001986
    description: >-
      An artifact an act produces; ranged broadly here, narrowed
      per-act in Chapter 7's facets.

  qualifies:
    any_of:
      - range: Claim
      - range: Method
    description: >-
      The claim or method whose standing this state records — the
      entity it qualifies.

  # CALLOUT: caused-by cco:ont00001819 is CCO "caused by" — a state (itself a Stasis process) to the act that conferred it.
  establishedBy:
    range: Act
    exact_mappings:
      - cco:ont00001819
    description: The act that established this state.

  # CALLOUT: state-occupies obo:BFO_0000199 is BFO "occupies temporal region" — a state to the interval it holds over, as performedAt does for an act.
  occursOver:
    range: TemporalInterval
    exact_mappings:
      - obo:BFO_0000199
    description: The interval over which this state holds.

  subject:
    range: Claim
    description: >-
      The claim that bears on another in an evidential relation.

  object:
    range: Claim
    description: >-
      The claim borne upon in an evidential relation.

  polarity:
    range: EvidentialPolarity
    description: >-
      Which cito-typed direction the relation takes — supports,
      contradicts, or refines.

  strength:
    range: float
    description: >-
      How strongly the bearing holds; an unbounded float here, with
      scale and bounds set in Chapter 7's facets. Shared by
      EvidentialRelation and EvidenceLine.

  assertedBy:
    range: Act
    description: >-
      The act that asserted this relation; its agent and time are
      reached through the act.

  quantifies:
    range: Uncertainty
    description: The uncertainty quality this model quantifies.

  family:
    range: string
    description: >-
      The distribution or method family — Gaussian, bootstrap, and
      so on. An open string, not enumerated.

  parameters:
    range: string
    multivalued: true
    description: >-
      The model's parameters; free strings here, with structured
      typing left to a later increment.

  confidenceLevel:
    range: float
    description: >-
      The confidence level the model reports, e.g. 0.95; its bounds
      set in Chapter 7's facets.

  nature:
    range: UncertaintyNature
    description: Whether the uncertainty is aleatory or epistemic.

  members:
    range: Evidence
    multivalued: true
    description: >-
      The pieces of evidence this line groups under one strength.

  bearsOn:
    range: Claim
    description: The claim the evidence line jointly bears on.

  # CALLOUT: has-part obo:BFO_0000117 is BFO "has occurrent part" — a process to its sub-processes; a Study has its acts as occurrent parts.
  hasPart:
    range: Act
    multivalued: true
    exact_mappings:
      - obo:BFO_0000117
    description: >-
      The acts that compose this study — the formations, searches,
      experiments, and analyses of one question-to-conclusion cycle.

enums:

  EvidentialPolarity:
    description: >-
      The direction of an evidential relation, mirroring the bare
      claim-relation slots and carrying the same CiTO typing.
    permissible_values:
      supports:
        meaning: cito:supports
        description: One claim bears positively on another.
      contradicts:
        meaning: cito:disputes
        description: One claim bears negatively on another.
      refines:
        meaning: cito:extends
        description: One claim refines or extends another.

  UncertaintyNature:
    description: >-
      Whether a result's uncertainty is aleatory (irreducible
      randomness) or epistemic (reducible lack of knowledge). A
      plain enum for now; a URREF grounding is deferred.
    permissible_values:
      aleatory:
        description: Irreducible variability in the phenomenon.
      epistemic:
        description: Reducible uncertainty from limited knowledge.
