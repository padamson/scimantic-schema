[book]
authors = ["Paul Adamson"]
language = "en"
src = "src"
title = "Building scimantic-schema"
description = "Rebuilding the scimantic LinkML schema from scratch, following Ontology Development 101 adapted to LinkML"

[build]
build-dir = "build"

[preprocessor]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.listings]
command = "mdbook-listings"
before = ["admonish", "links"]
number-listings = true
# In-page {{#list-of-listings}} index (see src/list-of-listings.md).
list-of-listings = true
# "nested" puts each page's listings under their section heading in the
# per-page TOC. NOT "append", whose book-wide section overlays mdbook's
# TOC with this theme (ontology-authoring-template dogfood finding,
# filed to mdbook-listings 2026-07-27).
list-of-listings-sidebar = "nested"

[output]

[output.html]
additional-css = ["./mdbook-admonish.css", "./mdbook-listings.css", "./soft-wrap.css", "./schema-link.css"]
additional-js = ["./mdbook-listings.js", "./schema-link.js"]

# Pre-2026-07-30 chapter URLs (intro was numbered ch01, offsetting every
# N&M step by one). Keep old deep links working after the renumbering.
[output.html.redirect]
"/ch01-introduction.html" = "introduction.html"
"/ch02-domain-and-scope.html" = "ch01-domain-and-scope.html"
"/ch03-reusing-existing-ontologies.html" = "ch02-reusing-existing-ontologies.html"
"/ch04-important-terms.html" = "ch03-important-terms.html"
"/ch05-classes-and-hierarchy.html" = "ch04-classes-and-hierarchy.html"
"/ch06-slots.html" = "ch05-slots.html"
"/ch07-slot-usage-and-facets.html" = "ch06-slot-usage-and-facets.html"
"/ch08-refinement-and-validation.html" = "ch07-refinement-and-validation.html"
